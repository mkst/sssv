<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSSV Level Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #161817;
      color: #f4f1ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #161817;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    .panel {
      position: fixed;
      top: 14px;
      left: 14px;
      width: min(430px, calc(100vw - 28px));
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(22, 24, 23, 0.86);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    select {
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      background: #272d2a;
      color: #f4f1ea;
      font: inherit;
      font-size: 13px;
    }

    select {
      min-width: 0;
      flex: 1;
      padding: 0 10px;
    }

    input[type="range"] {
      min-width: 0;
      width: 100%;
      accent-color: #8ecae6;
    }

    .compact-select {
      width: 138px;
      flex: 0 0 auto;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      white-space: nowrap;
    }

    .control-section {
      display: grid;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .row + .control-section {
      padding-top: 0;
      border-top: 0;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      color: #c7d5c8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-title span {
      color: #8f9b92;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }

    .layer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .layer-toggle {
      display: grid;
      grid-template-columns: auto 1fr auto;
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    .layer-toggle input {
      margin: 0;
    }

    .layer-toggle em {
      min-width: 22px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(142, 202, 230, 0.14);
      color: #a9d8ee;
      font-size: 11px;
      font-style: normal;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    details.advanced {
      margin-top: 2px;
    }

    details.advanced summary {
      cursor: pointer;
      color: #c7d5c8;
      font-size: 13px;
      user-select: none;
    }

    .advanced-options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-top: 10px;
    }

    .checkbox-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    .range-label {
      gap: 8px;
      width: 100%;
    }

    .range-label output {
      min-width: 34px;
      color: #c7d5c8;
      font-size: 12px;
      text-align: right;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .stat,
    .config-item {
      min-height: 48px;
      padding: 7px 8px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    .stat span,
    .config-item span {
      display: block;
      color: #aeb7b0;
      font-size: 11px;
    }

    .stat strong,
    .config-item strong {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }

    #status {
      min-height: 18px;
      color: #c7d5c8;
      font-size: 12px;
      line-height: 1.45;
    }

    .hover-card {
      position: fixed;
      z-index: 10;
      max-width: min(360px, calc(100vw - 28px));
      padding: 10px 11px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 7px;
      background: rgba(18, 20, 19, 0.94);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.34);
      color: #f4f1ea;
      font-size: 12px;
      line-height: 1.38;
      pointer-events: none;
    }

    .hover-card[hidden] {
      display: none;
    }

    .hover-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .hover-card dl {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 3px 10px;
      margin: 0;
    }

    .hover-card dt {
      color: #aeb7b0;
    }

    .hover-card dd {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      .panel {
        top: 8px;
        left: 8px;
        width: calc(100vw - 16px);
        padding: 10px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .config-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .layer-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>

      <div class="layer-grid">
        <label class="layer-toggle"><input id="showGeo" type="checkbox" checked> Geometry <em>10</em></label>
        <label class="layer-toggle"><input id="showWater" type="checkbox"> Water <em>12</em></label>
        <label class="layer-toggle"><input id="showMap" type="checkbox"> Terrain <em>9</em></label>
        <label class="layer-toggle"><input id="showUpperMap" type="checkbox"> Upper terrain <em>9</em></label>
        <label class="layer-toggle"><input id="showAnimals" type="checkbox" checked> Animals <em>1</em></label>
        <label class="layer-toggle"><input id="showObjects" type="checkbox" checked> Objects <em>0</em></label>
        <label class="layer-toggle"><input id="showObjectModels" type="checkbox" checked> Object models <em>0</em></label>
        <label class="layer-toggle"><input id="showLinks" type="checkbox"> Links <em>2</em></label>
        <label class="layer-toggle"><input id="showPaths" type="checkbox"> Paths <em>6</em></label>
        <label class="layer-toggle"><input id="showCameras" type="checkbox"> Cameras <em>13</em></label>
        <label class="layer-toggle"><input id="showDynamic" type="checkbox" checked> Vines / Ropes <em>7</em></label>
        <label class="layer-toggle"><input id="showFlow" type="checkbox" checked> Flow <em>9</em></label>
        <label class="layer-toggle"><input id="showRegions" type="checkbox"> AI Regions <em>5</em></label>
        <label class="layer-toggle"><input id="showCellLighting" type="checkbox"> Cell lighting <em>12</em></label>
        <label class="layer-toggle"><input id="showStart" type="checkbox" checked> Start <em>12</em></label>
        <label class="layer-toggle"><input id="showCollision" type="checkbox"> Collision <em>9</em></label>
      </div>
    </div>

    <div class="control-section">
      <details class="advanced">
        <summary>Advanced</summary>
        <div class="advanced-options">
          <label>Textures
            <select id="textureMode" class="compact-select">
              <option value="on">Enabled</option>
              <option value="off">Disabled</option>
              <option value="id">Texture ID</option>
            </select>
          </label>
          <label>Terrain color
            <select id="terrainColorMode" class="compact-select">
              <option value="material">Material ID</option>
              <option value="friction">Friction</option>
              <option value="heightOffset">Upper offset</option>
              <option value="landing">Landing</option>
              <option value="surfaceState">Surface state</option>
            </select>
          </label>
          <div class="checkbox-row">
            <label><input id="showLabels" type="checkbox" checked> Labels</label>
            <label><input id="wireframe" type="checkbox"> Wireframe</label>
            <label><input id="showFog" type="checkbox"> Fog</label>
          </div>
          <label class="range-label">Terrain opacity <input id="mapOpacity" type="range" min="0" max="1000" value="1000"><output id="mapOpacityValue">100%</output></label>
          <label><input id="snapPaths" type="checkbox" checked> Snap paths to ground</label>
          <label><input id="mirrorLongAxis" type="checkbox" checked> In-game orientation</label>
        </div>
      </details>
    </div>

    <div class="stats">
      <div class="stat"><span>Faces</span><strong id="statFaces">-</strong></div>
      <div class="stat"><span>Triangles</span><strong id="statTriangles">-</strong></div>
      <div class="stat"><span>Objects / Animals</span><strong id="statEntities">-</strong></div>
    </div>

    <div class="config-grid">
      <div class="config-item"><span>Fog</span><strong id="cfgFog">-</strong></div>
      <div class="config-item"><span>Clip / FOV</span><strong id="cfgCamera">-</strong></div>
      <div class="config-item"><span>Segment / Texture</span><strong id="cfgTexture">-</strong></div>
      <div class="config-item"><span>Water</span><strong id="cfgWater">-</strong></div>
      <div class="config-item"><span>Headings</span><strong id="cfgHeadings">-</strong></div>
      <div class="config-item"><span>Light</span><strong id="cfgLight">-</strong></div>
    </div>

    <div id="status">Choose a level from the dropdown.</div>
  </section>
  <div id="hoverCard" class="hover-card" hidden></div>

  <script type="importmap">
    {
      "imports": {

  <script type="module">

    const levelConfigAliases = {
      fogMin: "unk2",
      fogMax: "unk4",

      fogGreen: "unk8",
      fogBlue: "unkA",
      nearClip: "unkC",
      farClip: "unkE",
      waterTileX: "unk10",
      waterTileZ: "unk12",

    };

    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 6; col++) {
        levelConfigAliases[`cellLightingModes${row}${col}`] = `unk${(0x5c + (row * 6) + col).toString(16).toUpperCase()}`;
      }
    }

    function configValue(levelConfig, key, fallback = 0) {
      if (!levelConfig) return fallback;
      if (levelConfig[key] != null) return levelConfig[key];
      const oldKey = levelConfigAliases[key];
      if (oldKey && levelConfig[oldKey] != null) return levelConfig[oldKey];
      return fallback;
    }

    function colorFromRgb(r, g, b) {
      return new THREE.Color((r ?? 0) / 255, (g ?? 0) / 255, (b ?? 0) / 255);
    }

    function makePlaceholderTexture() {
      const canvas = document.createElement("canvas");
      const size = 128;
      const cells = 8;
      const context = canvas.getContext("2d");
      canvas.width = size;
      canvas.height = size;
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          context.fillStyle = (x + y) % 2 ? "#8f9a7a" : "#4f6559";
          context.fillRect((x * size) / cells, (y * size) / cells, size / cells, size / cells);
        }
      }
      context.strokeStyle = "rgba(255, 255, 255, 0.18)";
      context.lineWidth = 2;
      for (let i = 0; i <= cells; i++) {
        const p = (i * size) / cells;
        context.beginPath();
        context.moveTo(p, 0);
        context.lineTo(p, size);
        context.moveTo(0, p);
        context.lineTo(size, p);
        context.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(12, 12);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
